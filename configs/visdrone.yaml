# Dataset configuration for Ultralytics YOLO
# Expected folder structure:
# VisDrone2019-DET/
# ├── train/images
# ├── train/labels
# ├── val/images
# └── val/labels

path: /data/VisDrone2019-DET
train: train/images
val: val/images
test: test/images

# VisDrone categories (10 classes)
names:
  0: pedestrian
  1: people
  2: bicycle
  3: car
  4: van
  5: truck
  6: tricycle
  7: awning-tricycle
  8: bus
  9: motor
